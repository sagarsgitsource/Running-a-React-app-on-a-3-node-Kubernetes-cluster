server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Close every connection after one response, so each request from the
    # browser is a new connection and the Service can pick a (possibly
    # different) Pod each time.
    keepalive_timeout 0;

    # Replies with the container's hostname. Inside Kubernetes, that is the Pod name.
    location = /whoami {
        default_type text/plain;
        add_header Cache-Control "no-store";
        return 200 "$hostname\n";
    }

    location / {
        try_files $uri /index.html;
    }
}
